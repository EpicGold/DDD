const LOGO_SIZE = 790, LX = W / 2, LY = 468;

const scene = document.createElement("canvas"); scene.width = W; scene.height = H;
const sc = scene.getContext("2d");
const tmp = document.createElement("canvas"); tmp.width = LOGO_SIZE; tmp.height = LOGO_SIZE;
const tc = tmp.getContext("2d");

let CELLS = [], scan, vign, noiseTiles = [];
function prepare() {
  // logo -> grid of coloured cells for the pixel-assembly effect
  const N = 46, cs = LOGO_SIZE / N;
  const s = document.createElement("canvas"); s.width = N; s.height = N;
  const g = s.getContext("2d"); g.imageSmoothingEnabled = true; g.drawImage(logo, 0, 0, N, N);
  const d = g.getImageData(0, 0, N, N).data;
  const r = rng(7);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4;
    if (d[i + 3] < 110) continue;
    const tx = LX - LOGO_SIZE / 2 + x * cs, ty = LY - LOGO_SIZE / 2 + y * cs;
    const a0 = r() * Math.PI * 2, r0 = 900 + r() * 700;
    const dx = tx + cs / 2 - LX, dy = ty + cs / 2 - LY;
    CELLS.push({ tx, ty, cs, col: [d[i], d[i + 1], d[i + 2]], a0, r0,
      at: Math.atan2(dy, dx), rt: Math.hypot(dx, dy), delay: 0.05 + r() * 0.34 + (Math.hypot(dx, dy) / 560) * 0.18, spin: 1.2 + r() * 1.6 });
  }
  // scanlines
  scan = document.createElement("canvas"); scan.width = W; scan.height = H;
  const q = scan.getContext("2d");
  for (let y = 0; y < H; y += 4) { q.fillStyle = "rgba(0,0,0,0.22)"; q.fillRect(0, y + 2, W, 2); }
  // vignette
  vign = document.createElement("canvas"); vign.width = W; vign.height = H;
  const v = vign.getContext("2d");
  const gr = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.78)");
  v.fillStyle = gr; v.fillRect(0, 0, W, H);
  // film grain tiles
  for (let k = 0; k < 6; k++) {
    const n = document.createElement("canvas"); n.width = 256; n.height = 256;
    const nc = n.getContext("2d"), id = nc.createImageData(256, 256), rr = rng(100 + k);
    for (let i = 0; i < id.data.length; i += 4) { const g2 = rr() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = g2; id.data[i + 3] = 16; }
    nc.putImageData(id, 0, 0); noiseTiles.push(n);
  }
}

// ---------- background: chalk formulas ----------
const FORMULAS = ["∫ dx", "a²+b²=c²", "F = ma", "E = mc²", "sin²x + cos²x = 1", "π ≈ 3.14", "print(\"jam!\")", "√2", "Σ n", "x = (−b ± √D) / 2a",
  "while True:", "def game():", "v = s / t", "y = kx + b", "Δt → 0", "log₂ 1024 = 10", "if hp <= 0:", "lvl += 1", "claude.run()", "90°", "∞", "e^{iπ}+1=0"];
const FORM = (() => { const r = rng(42); return Array.from({ length: 30 }, (_, i) => ({
  txt: FORMULAS[i % FORMULAS.length], x: r() * W, y: r() * 760, size: 22 + Math.floor(r() * 4) * 8,
  a: 0.07 + r() * 0.1, sp: 6 + r() * 14, ph: r() * 6.28, rot: (r() - 0.5) * 0.25 })); })();

function drawBackground(g, t) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#020b07"); gr.addColorStop(0.55, "#06170f"); gr.addColorStop(1, "#020604");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // chalkboard pixel grid
  g.fillStyle = "rgba(57,255,106,0.035)";
  for (let x = 0; x < W; x += 48) g.fillRect(x, 0, 2, 780);
  for (let y = 0; y < 780; y += 48) g.fillRect(0, y, W, 2);
  // formulas
  const fin = seg(t, 0.9, 2.0);
  g.textBaseline = "middle";
  for (const f of FORM) {
    const y = ((f.y - t * f.sp) % 800 + 800) % 800 - 20;
    const x = f.x + Math.sin(t * 0.6 + f.ph) * 18;
    g.save(); g.translate(snap(x), snap(y)); g.rotate(f.rot);
    g.font = `${f.size}px PS2P`; g.fillStyle = `rgba(230,255,235,${f.a * fin})`;
    g.fillText(f.txt, 0, 0); g.restore();
  }
  drawGrid(g, t);
}

// ---------- synthwave floor grid ----------
function drawGrid(g, t) {
  const hz = 770, k = seg(t, 0.8, 1.8);
  if (k <= 0) return;
  const glow = g.createLinearGradient(0, hz - 140, 0, hz + 30);
  glow.addColorStop(0, "rgba(57,255,106,0)"); glow.addColorStop(0.8, `rgba(57,255,106,${0.16 * k})`); glow.addColorStop(1, "rgba(57,255,106,0)");
  g.fillStyle = glow; g.fillRect(0, hz - 140, W, 170);
  g.fillStyle = "rgba(1,8,4,0.9)"; g.fillRect(0, hz, W, H - hz);
  g.save(); g.globalAlpha = k;
  // horizontal lines rushing towards the viewer
  const speed = 0.55;
  for (let i = 0; i < 18; i++) {
    const z = ((i + (t * speed) % 1) / 18);
    const p = Math.pow(z, 2.6);
    const y = hz + p * (H - hz + 40);
    const a = clamp(p * 1.4) * 0.75;
    g.fillStyle = `rgba(57,255,106,${a})`;
    g.fillRect(0, snap(y), W, Math.max(2, snap(p * 6)));
  }
  // vertical lines to the vanishing point
  g.strokeStyle = "rgba(57,255,106,0.45)"; g.lineWidth = 3;
  g.beginPath();
  for (let i = -16; i <= 16; i++) { g.moveTo(W / 2 + i * 22, hz); g.lineTo(W / 2 + i * 300, H + 20); }
  g.stroke();
  g.fillStyle = "rgba(57,255,106,0.9)"; g.fillRect(0, hz - 1, W, 3);
  g.restore();
}

// ---------- glow + rings behind the logo ----------
function drawAura(g, t, bob) {
  const k = seg(t, T.impact - 0.25, T.impact + 0.2);
  if (k <= 0) return;
  const pulse = 1 + 0.35 * Math.exp(-Math.max(0, t - T.impact) * 4) + 0.05 * Math.sin(t * 2.4);
  const gr = g.createRadialGradient(LX, LY + bob, 60, LX, LY + bob, 620 * pulse);
  gr.addColorStop(0, `rgba(57,255,106,${0.34 * k})`); gr.addColorStop(0.5, `rgba(20,140,60,${0.14 * k})`); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // two counter-rotating pixel rings
  const rings = [{ r: 452, n: 72, sz: 8, sp: 0.25, on: 3, col: GREEN }, { r: 488, n: 120, sz: 6, sp: -0.14, on: 5, col: LIME }];
  for (const R of rings) {
    for (let i = 0; i < R.n; i++) {
      if (i % (R.on + 2) >= R.on) continue;
      const a = (i / R.n) * Math.PI * 2 + t * R.sp;
      const x = snap(LX + Math.cos(a) * R.r * (0.9 + 0.1 * k)), y = snap(LY + bob + Math.sin(a) * R.r * (0.9 + 0.1 * k));
      g.globalAlpha = k * (0.55 + 0.45 * Math.sin(a * 3 + t * 2) ** 2);
      g.fillStyle = R.col; g.fillRect(x - R.sz / 2, y - R.sz / 2, R.sz, R.sz);
    }
  }
  g.globalAlpha = 1;
}

// ---------- logo: pixel assembly, impact, idle ----------
function drawLogo(g, t, bob) {
  if (t < T.assemble) return;
  const cross = seg(t, T.impact - 0.06, T.impact + 0.1);
  if (cross < 1) {
    // flying pixels
    for (const c of CELLS) {
      const k = easeOutCubic(seg(t, T.assemble + c.delay, T.assemble + c.delay + 0.55));
      if (k <= 0) continue;
      const ang = lerp(c.a0 + c.spin, c.at, k), rad = lerp(c.r0, c.rt, k);
      const x = LX + Math.cos(ang) * rad, y = LY + Math.sin(ang) * rad;
      const sz = c.cs * lerp(1.9, 1.02, k);
      const m = 1 - k;
      const r = Math.round(lerp(c.col[0], 57, m * 0.8)), gg = Math.round(lerp(c.col[1], 255, m * 0.8)), b = Math.round(lerp(c.col[2], 106, m * 0.8));
      g.globalAlpha = clamp(k * 3) * (1 - cross);
      g.fillStyle = `rgb(${r},${gg},${b})`;
      g.fillRect(snap(x - sz / 2), snap(y - sz / 2), Math.ceil(sz), Math.ceil(sz));
    }
    g.globalAlpha = 1;
  }
  if (cross <= 0) return;
  const idle = Math.max(0, t - T.impact);
  const settle = easeOutBack(seg(t, T.impact - 0.06, T.impact + 0.35));
  const s = LOGO_SIZE * (1.06 - 0.06 * settle) * (1 + 0.006 * Math.sin(idle * 1.9));
  const x = LX - s / 2, y = LY - s / 2 + bob;
  // glint: diagonal light band masked by the logo
  tc.clearRect(0, 0, LOGO_SIZE, LOGO_SIZE);
  tc.imageSmoothingEnabled = true; tc.drawImage(logo, 0, 0, LOGO_SIZE, LOGO_SIZE);
  const gt = glintPhase(t);
  if (gt >= 0 && gt <= 1) {
    tc.globalCompositeOperation = "source-atop";
    const bx = lerp(-LOGO_SIZE * 0.6, LOGO_SIZE * 1.6, easeInCubic(gt) * 0.5 + gt * 0.5);
    const lg = tc.createLinearGradient(bx - 140, 0, bx + 140, 0);
    lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(0.5, "rgba(255,255,255,0.55)"); lg.addColorStop(1, "rgba(255,255,255,0)");
    tc.save(); tc.translate(LOGO_SIZE / 2, LOGO_SIZE / 2); tc.rotate(-0.5); tc.translate(-LOGO_SIZE / 2, -LOGO_SIZE / 2);
    tc.fillStyle = lg; tc.fillRect(-LOGO_SIZE, -LOGO_SIZE, LOGO_SIZE * 3, LOGO_SIZE * 3); tc.restore();
    tc.globalCompositeOperation = "source-over";

  g.save(); g.globalAlpha = cross * 0.55; g.filter = "blur(18px)";
  g.drawImage(logo, x + 10, y + 26, s, s); g.restore();
  g.filter = "none";
  // chromatic split right after impact
  const ch = Math.exp(-idle * 9) * 16 * (cross >= 1 ? 1 : 0);

}
function glintPhase(t) {
  if (t < T.glint0) return -1;
  const k = (t - T.glint0) % T.glintEvery;
  return k / 0.9;
}

// ---------- particles ----------
const BURST = (() => { const r = rng(9); return Array.from({ length: 190 }, () => {
  const a = r() * Math.PI * 2, sp = 320 + r() * 900;
  return { a, sp, r0: 300 + r() * 110, sz: [6, 8, 10, 14][Math.floor(r() * 4)], life: 0.7 + r() * 0.9, col: [GREEN, "#ffffff", LIME, "#1fd35a"][Math.floor(r() * 4)] }; }); })();
function drawBurst(g, t) {
  const dt = t - T.impact; if (dt < 0 || dt > 1.8) return;
  for (const p of BURST) {
    if (dt > p.life) continue;
    const k = dt / p.life;
    const x = LX + Math.cos(p.a) * (p.r0 + p.sp * dt * (1 - 0.35 * k));
    const y = LY + Math.sin(p.a) * (p.r0 + p.sp * dt * (1 - 0.35 * k)) + 520 * dt * dt;
    g.globalAlpha = 1 - k; g.fillStyle = p.col;
    const sz = p.sz * (1 - 0.5 * k);
    g.fillRect(snap(x), snap(y), snap(sz), snap(sz));

  g.globalAlpha = 1;
}
function drawDust(g, t) {
  const k = seg(t, T.impact, T.impact + 1.0); if (k <= 0) return;
  for (let i = 0; i < 70; i++) {
    const per = 5 + hash(i) * 6, ph = ((t + hash(i + 3) * per) % per) / per;
    const x = hash(i + 11) * W + Math.sin(t * 0.8 + i) * 30;
    const y = H + 20 - ph * (H + 60);
    const a = Math.sin(ph * Math.PI) * 0.55 * k;
    g.fillStyle = i % 3 ? `rgba(57,255,106,${a})` : `rgba(255,255,255,${a})`;
    const sz = i % 5 === 0 ? 6 : 4;
    g.fillRect(snap(x), snap(y), sz, sz);
  }
}
function drawShockwave(g, t) {
  const dt = t - T.impact; if (dt < 0 || dt > 0.8) return;
  const k = dt / 0.8, R = lerp(360, 1250, easeOutCubic(k)), n = 180, sz = Math.max(4, snap(lerp(22, 4, k)));
  g.fillStyle = k < 0.25 ? "#ffffff" : GREEN; g.globalAlpha = 1 - k;
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; g.fillRect(snap(LX + Math.cos(a) * R - sz / 2), snap(LY + Math.sin(a) * R * 0.92 - sz / 2), sz, sz); }
  g.globalAlpha = 1;
}

// ---------- text ----------
const BOOT = ["> YARMAK_ENGINE v20.26", "> ЗАГРУЗКА PYTHON ........ OK", "> ЗАГРУЗКА CLAUDE ........ OK", "> ВАЙБКОДИНГ ............. 100%"];
function drawBoot(g, t) {
  const fade = 1 - seg(t, 1.45, 1.8); if (t < T.boot || fade <= 0) return;
  g.font = "26px PS2P"; g.textBaseline = "top";
  let left = (t - T.boot) * 70;
  BOOT.forEach((line, i) => {
    const n = clamp(Math.floor(left), 0, line.length); left -= line.length + 3;
    if (n <= 0) return;
    g.fillStyle = `rgba(57,255,106,${0.9 * fade})`;
    g.fillText(line.slice(0, n), 80, 70 + i * 46);
    if (n < line.length && Math.floor(t * 8) % 2 === 0) g.fillRect(80 + g.measureText(line.slice(0, n)).width + 6, 70 + i * 46, 20, 26);
  });
}
const PRESENTS = "ПРЕДСТАВЛЯЕТ";
function drawPresents(g, t) {
  if (t < T.presents) return;
  const n = clamp(Math.floor((t - T.presents) / 0.07), 0, PRESENTS.length);
  const str = PRESENTS.slice(0, n);
  g.save(); g.font = "700 58px Pixelify"; g.textBaseline = "middle"; g.textAlign = "left";
  g.letterSpacing = "14px";
  const full = g.measureText(PRESENTS).width, x0 = W / 2 - full / 2, y = 948;
  g.fillStyle = "rgba(0,0,0,0.55)"; g.fillText(str, x0 + 5, y + 6);
  g.fillStyle = DEEP; g.fillText(str, x0 + 3, y + 3);
  g.fillStyle = "#f4fff6"; g.fillText(str, x0, y);
  if (n < PRESENTS.length || Math.floor(t * 2.2) % 2 === 0) {
    g.fillStyle = GREEN; g.fillRect(x0 + g.measureText(str).width + 6, y - 26, 26, 52);
  }
  // chalk underline drawn from the centre
  const u = easeOutCubic(seg(t, T.presents + 0.9, T.presents + 1.5));
  if (u > 0) { g.fillStyle = GREEN; const w = full * u; for (let x = -w / 2; x < w / 2; x += 12) g.fillRect(snap(W / 2 + x), y + 42 + (Math.floor(x / 12) % 2 ? 2 : 0), 8, 5); }
  g.restore();
}
function drawPrompt(g, t) {
  if (CAPTURE || t < T.prompt) return;
  if (Math.floor((t - T.prompt) * 1.6) % 2) return;
  g.save(); g.font = "22px PS2P"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(0,0,0,0.6)"; g.fillText("НАЖМИТЕ ЛЮБУЮ КЛАВИШУ", W / 2 + 3, 1030 + 3);
  g.fillStyle = LIME; g.fillText("НАЖМИТЕ ЛЮБУЮ КЛАВИШУ", W / 2, 1030); g.restore();
}

// ---------- compose one frame ----------
function renderScene(g, t) {
  const idle = Math.max(0, t - T.impact);
  const bob = t > T.impact ? Math.sin(idle * (Math.PI * 2 / 3.4)) * 8 : 0;
  const sh = Math.exp(-Math.max(0, t - T.impact) * 7) * (t >= T.impact ? 20 : 0);
  g.save();
  g.translate(snap(Math.sin(t * 91) * sh), snap(Math.cos(t * 77) * sh));
  drawBackground(g, t);
  drawAura(g, t, bob);
  drawDust(g, t);
  drawLogo(g, t, bob);
  drawShockwave(g, t);
  drawBurst(g, t);
  g.restore();
  drawBoot(g, t);
  drawPresents(g, t);
  drawPrompt(g, t);
  // impact flash
  const f = t >= T.impact ? Math.exp(-(t - T.impact) * 7) : 0;
  if (f > 0.01) { g.fillStyle = `rgba(220,255,230,${0.62 * f})`; g.fillRect(0, 0, W, H); }
}

function render(t, outroAt) {
  const out = outroAt == null ? Infinity : t - outroAt;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (out > T.outroLen) return true;
  renderScene(sc, t);
  // CRT effects
  sc.drawImage(scan, 0, 0); sc.drawImage(vign, 0, 0);
  sc.drawImage(noiseTiles[Math.floor(t * 24) % noiseTiles.length], 0, 0, W, H);
  // glitch slices (small at impact, strong before switch-off)
  const gl = Math.max(t >= T.impact && t < T.impact + 0.18 ? 0.5 : 0, out >= 0 ? clamp(out / 0.25) : 0);
  // CRT turn-on
  if (t < 0.52) {
    const w = W * easeOutCubic(seg(t, T.crtOn, 0.24)), h = Math.max(4, H * easeInCubic(seg(t, 0.24, 0.52)));
    if (w <= 0) return false;
    ctx.save(); ctx.beginPath(); ctx.rect(W / 2 - w / 2, H / 2 - h / 2, w, h); ctx.clip();
    ctx.drawImage(scene, 0, 0);
    ctx.fillStyle = `rgba(230,255,235,${1 - seg(t, 0.3, 0.52)})`; ctx.fillRect(0, 0, W, H);
    ctx.restore(); return false;
  }
  if (out >= 0) {
    // CRT switch-off: squash to a line, then to a dot
    const a = easeInCubic(seg(out, 0.12, 0.42)), b = easeInCubic(seg(out, 0.42, 0.62));
    const sy = lerp(1, 0.006, a), sx = lerp(1, 0.004, b);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sx, sy); ctx.translate(-W / 2, -H / 2);
    drawSlices(gl); ctx.restore();
    const bright = seg(out, 0.1, 0.45) * (1 - seg(out, 0.62, 0.85));
    ctx.fillStyle = `rgba(235,255,240,${bright})`;
    ctx.fillRect(W / 2 - (W * sx) / 2, H / 2 - Math.max(3, H * sy) / 2, W * sx, Math.max(3, H * sy));
    if (out > 0.55) { const d = 1 - seg(out, 0.6, 0.85); ctx.fillStyle = `rgba(255,255,255,${d})`; ctx.fillRect(W / 2 - 5, H / 2 - 5, 10, 10); }
    return false;
  }
  drawSlices(gl);
  return false;
}
function drawSlices(gl) {
  if (gl <= 0.01) { ctx.drawImage(scene, 0, 0); return; }
  const r = rng(Math.floor(performanceSeed() * 1000));
  let y = 0;
  while (y < H) {
    const h = 20 + Math.floor(r() * 90);
    const dx = r() < 0.45 ? (r() - 0.5) * 140 * gl : 0;
    ctx.drawImage(scene, 0, y, W, h, dx, y, W, h);
    if (dx !== 0 && r() < 0.5) { ctx.fillStyle = r() < 0.5 ? "rgba(255,0,140,0.18)" : "rgba(0,255,220,0.18)"; ctx.fillRect(0, y, W, h); }
    y += h;
  }
}
let _seedT = 0; const performanceSeed = () => _seedT;

// ---------- audio (chiptune, WebAudio; also rendered offline for the video) ----------
function scheduleAudio(ac, dest, t0, outroAt) {
  const master = ac.createGain(); master.gain.value = 0.55; master.connect(dest);
  const comp = ac.createDynamicsCompressor(); comp.connect(master);
  const out = comp;
  const tone = (type, f0, f1, at, dur, vol, slide = "exp") => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0 + at);
    if (f1 && f1 !== f0) (slide === "exp" ? o.frequency.exponentialRampToValueAtTime(f1, t0 + at + dur) : o.frequency.linearRampToValueAtTime(f1, t0 + at + dur));
    g.gain.setValueAtTime(0.0001, t0 + at); g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);

  };
  const noiseBuf = (() => { const b = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate), d = b.getChannelData(0), r = rng(5); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; return b; })();
  const noise = (at, dur, vol, f0, f1) => {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; fl.type = "lowpass"; fl.frequency.setValueAtTime(f0, t0 + at); fl.frequency.exponentialRampToValueAtTime(f1, t0 + at + dur);
    g.gain.setValueAtTime(vol, t0 + at); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t0 + at); s.stop(t0 + at + dur + 0.05);
  };
  const N = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // CRT power-on
  noise(0.1, 0.25, 0.25, 6000, 300); tone("square", 60, 45, 0.1, 0.3, 0.2);
  // boot typing blips
  let left = 0; const total = BOOT.reduce((a, l) => a + l.length + 3, 0);
  for (let i = 0; i < total; i += 2) { const at = T.boot + i / 70; if (at > 1.42) break; tone("square", 1400 + (i % 7) * 60, 0, at, 0.018, 0.05); }
  // rising sweep while pixels assemble
  tone("square", 110, 880, T.assemble, T.impact - T.assemble, 0.07);
  tone("triangle", 55, 440, T.assemble, T.impact - T.assemble, 0.12);
  // impact
  tone("sine", 160, 38, T.impact, 0.55, 0.9); noise(T.impact, 0.7, 0.55, 9000, 200);
  // victory jingle
  const mel = [[72, 0], [76, 0.11], [79, 0.22], [84, 0.33], [79, 0.5], [84, 0.61], [88, 0.72]];
  mel.forEach(([m, at], i) => tone("square", N(m), 0, T.impact + 0.05 + at, i === mel.length - 1 ? 0.9 : 0.14, 0.11));
  mel.forEach(([m, at], i) => tone("square", N(m + 12) * 1.004, 0, T.impact + 0.05 + at, i === mel.length - 1 ? 0.7 : 0.1, 0.035));
  [[48, 0, 0.3], [55, 0.33, 0.3], [60, 0.72, 1.1]].forEach(([m, at, d]) => tone("triangle", N(m), 0, T.impact + 0.05 + at, d, 0.3));
  [[64, 0.72], [67, 0.72], [72, 0.72]].forEach(([m, at]) => tone("triangle", N(m), 0, T.impact + 0.05 + at, 1.1, 0.08));
  // glints
  for (let g0 = T.glint0; g0 < (outroAt ?? T.glint0 + 30); g0 += T.glintEvery) { tone("sine", 2200, 6400, g0 + 0.15, 0.35, 0.05); tone("sine", 3300, 8800, g0 + 0.2, 0.3, 0.03); }
  // "ПРЕДСТАВЛЯЕТ" typing
  for (let i = 0; i < PRESENTS.length; i++) tone("square", N(79 + (i % 3) * 2), 0, T.presents + i * 0.07, 0.04, 0.06);
  tone("triangle", N(67), 0, T.presents + 0.95, 0.5, 0.15); tone("triangle", N(72), 0, T.presents + 1.1, 0.8, 0.15);
  // switch-off
  if (outroAt != null) { noise(outroAt, 0.25, 0.3, 4000, 400); tone("square", 880, 40, outroAt + 0.1, 0.5, 0.12); tone("sine", 1200, 90, outroAt + 0.4, 0.3, 0.1); }
}

// offline render -> 16-bit WAV (base64) for the video
async function renderAudioWav(seconds, outroAt) {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  scheduleAudio(oc, oc.destination, 0, outroAt);
  const buf = await oc.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); dv.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); dv.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  let bin = ""; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}

// ---------- live playback ----------
let start = null, outroAt = null, ac = null, done = false;
function gate(t) { // "press to start" screen (needed for sound in browsers)
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.font = "28px PS2P"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (Math.floor(t * 1.6) % 2 === 0) { ctx.fillStyle = GREEN; ctx.fillText("▶ НАЖМИТЕ, ЧТОБЫ НАЧАТЬ", W / 2, H / 2); }
  ctx.font = "16px PS2P"; ctx.fillStyle = "rgba(57,255,106,0.45)"; ctx.fillText("ЗВУК ВКЛЮЧИТСЯ ПОСЛЕ НАЖАТИЯ", W / 2, H / 2 + 60);
}
function begin(withSound) {
  start = performance.now() / 1000;
  if (withSound) { ac = new (window.AudioContext || window.webkitAudioContext)(); scheduleAudio(ac, ac.destination, ac.currentTime + 0.02, null); }
}
function finish() {
  if (done) return; done = true;
  window.dispatchEvent(new Event("yarmak:intro-end"));
  try { window.parent && window.parent.postMessage({ type: "yarmak:intro-end" }, "*"); } catch (e) {}
}
function onInput() {
  if (start === null) { begin(true); return; }
  const t = performance.now() / 1000 - start;
  if (t < T.idle - 0.4) { start -= (T.idle - 0.4 - t); return; } // skip to the title screen
  if (outroAt === null) {
    outroAt = t;
    if (ac) { const o = ac.createOscillator(), g = ac.createGain(); o.type = "square"; o.frequency.setValueAtTime(880, ac.currentTime); o.frequency.exponentialRampToValueAtTime(40, ac.currentTime + 0.5);
      g.gain.setValueAtTime(0.08, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.55); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.6); }
  }
}
function loop() {
  const now = performance.now() / 1000;
  if (start === null) gate(now);
  else { const t = now - start; _seedT = Math.floor(t * 30) / 30; if (render(t, outroAt)) finish(); }
  requestAnimationFrame(loop);
}

// ---------- boot ----------
Promise.all([new Promise((r) => (logo.complete ? r() : (logo.onload = r))),
  document.fonts.load("22px PS2P", "ЗАГРУЗКА"), document.fonts.load("700 58px Pixelify", "ПРЕДСТАВЛЯЕТ")]).then(() => {
  prepare();
  if (CAPTURE) {
    window.renderFrame = (t) => { _seedT = Math.floor(t * 30) / 30; render(t, T.videoOutro); };
    window.renderAudioWav = renderAudioWav;
    window.READY = true; return;
  }
  if (params.has("autoplay")) begin(false);
  addEventListener("keydown", onInput); addEventListener("pointerdown", onInput);
  loop();
});
