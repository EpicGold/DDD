<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
/* ============================================================
   YARMAK TEAM — заставка №4 «Хоррор» (Canvas 2D + WebAudio).
   ~12 с: запись с камеры в тёмном кабинете №13 → луч фонаря по стене →
   фонарь гаснет → в темноте открываются глаза → 00:00:00, молния →
   логотип под качающейся лампой → «ПРЕДСТАВЛЯЕТ» → свет умирает.
   ?autoplay=1 — без звука; ?capture=1 — запись.
   По окончании: событие "yarmak:intro-end" + postMessage родителю.
   ============================================================ */
const W = 1920, H = 1080;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const params = new URLSearchParams(location.search), CAPTURE = params.has("capture");
const T = { click: 0.45, whoosh: 2.38, scare: 2.72, flick0: 4.05, dark: 4.75, eyes: 5.05, drop: 5.8, presents: 6.9, prompt: 8.4,
  loopA: 6.4, loopLen: 4.8, videoOutro: 10.4, outroLen: 1.2, videoLen: 12.0 };
const DIPS = [1.5, 2.85];              // light dips inside each ambient loop (s from loop start)
const BONE = "#e8e0cc", BLOOD = "#7a080c";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (k) => 1 - Math.pow(1 - k, 3), smooth = (k) => k * k * (3 - 2 * k);
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let r = Math.imul(s ^ (s >>> 15), 1 | s); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

// heartbeat times before the drop (shared by picture and sound): 57 → 120 bpm
const HB = (() => { const r = []; let t = 0.25; while (t < T.drop - 0.3) { r.push(t); t += lerp(1.05, 0.5, seg(t, 0.3, 5.2)); } return r; })();
const PRES = "ПРЕДСТАВЛЯЕТ";
const PRES_ON = (() => { const r = rng(33), idx = [...PRES].map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const on = []; idx.forEach((li, k) => (on[li] = T.presents + k * 0.055 + r() * 0.03)); return on; })();

const logo = new Image(); logo.src = "data:image/webp;base64,__LOGO__";
const LS = 700, LX = W / 2, LY = 470;
const EYE_UV = [[0.504, 0.123], [0.582, 0.1435]];
const scene = mk(W, H), sc = scene.getContext("2d");
const dk = mk(W, H), dq = dk.getContext("2d");       // darkness mask
const lc = mk(W, H), lq = lc.getContext("2d");       // lit logo layer
let wall, logoH, logoGlow, fogA, fogB, vign, GRAIN = [];

// ---------------- procedural textures ----------------
function noiseCv(w, h, seed, lo = 0, hi = 255, alphaMode = false) {
  const c = mk(w, h), q = c.getContext("2d"), id = q.createImageData(w, h), r = rng(seed);
  for (let i = 0; i < w * h; i++) { const v = lo + (hi - lo) * r(); const o = i * 4;
    if (alphaMode) { id.data[o] = id.data[o + 1] = id.data[o + 2] = 0; id.data[o + 3] = v; } else { id.data[o] = id.data[o + 1] = id.data[o + 2] = v; id.data[o + 3] = 255; } }
  q.putImageData(id, 0, 0); return c;
}
function prepare() {
  const r = rng(4);
  // ---- the wall: dirty whitewash over an old green school panel
  wall = mk(W, H); const w = wall.getContext("2d");
  let gr = w.createLinearGradient(0, 0, 0, 700); gr.addColorStop(0, "#4c483f"); gr.addColorStop(1, "#66625a"); w.fillStyle = gr; w.fillRect(0, 0, W, 700);
  gr = w.createLinearGradient(0, 700, 0, H); gr.addColorStop(0, "#25442f"); gr.addColorStop(1, "#193022"); w.fillStyle = gr; w.fillRect(0, 700, W, H - 700);
  w.fillStyle = "#2c2a23"; w.fillRect(0, 692, W, 12); w.fillStyle = "rgba(255,255,240,0.08)"; w.fillRect(0, 704, W, 2);
  w.globalCompositeOperation = "multiply";
  w.filter = "blur(40px)"; w.drawImage(noiseCv(24, 14, 1, 105, 255), -80, -80, W + 160, H + 160);
  w.filter = "blur(5px)"; w.globalAlpha = 0.75; w.drawImage(noiseCv(160, 90, 2, 150, 255), 0, 0, W, H);
  w.filter = "none"; w.globalAlpha = 1;
  w.globalCompositeOperation = "overlay"; w.globalAlpha = 0.3; w.drawImage(noiseCv(960, 540, 3), 0, 0, W, H);
  w.globalAlpha = 1; w.globalCompositeOperation = "source-over";
  // water stains from the ceiling and rust streaks under the divider
  w.filter = "blur(10px)";
  for (let i = 0; i < 20; i++) { const x = r() * W, wd = 20 + r() * 90, len = 120 + r() * 520; const g2 = w.createLinearGradient(0, 0, 0, len);
    g2.addColorStop(0, "rgba(52,38,18,0.55)"); g2.addColorStop(1, "rgba(52,38,18,0)"); w.fillStyle = g2; w.fillRect(x, -10, wd, len); }
  for (let i = 0; i < 14; i++) { const x = r() * W, wd = 8 + r() * 30, len = 50 + r() * 200; const g2 = w.createLinearGradient(0, 700, 0, 700 + len);
    g2.addColorStop(0, "rgba(70,40,12,0.5)"); g2.addColorStop(1, "rgba(70,40,12,0)"); w.fillStyle = g2; w.fillRect(x, 700, wd, len); }
  w.filter = "none";
  // peeling paint on the green panel
  for (let i = 0; i < 26; i++) {
    const cx = r() * W, cy = 720 + r() * 280, R = 8 + r() * 38, n = 24; w.beginPath();
    for (let k = 0; k <= n; k++) { const a = k / n * Math.PI * 2, rr = R * (0.4 + 0.6 * r()); const x = cx + Math.cos(a) * rr * 1.5, y = cy + Math.sin(a) * rr * 0.9; k ? w.lineTo(x, y) : w.moveTo(x, y); }
    w.fillStyle = "rgba(78,74,62,0.85)"; w.fill(); w.strokeStyle = "rgba(150,160,140,0.25)"; w.lineWidth = 1.5; w.stroke();
    w.save(); w.translate(1.5, 2); w.strokeStyle = "rgba(6,14,9,0.6)"; w.lineWidth = 2; w.stroke(); w.restore();
  }
  // cracks
  for (let i = 0; i < 8; i++) {
    let x = r() * W, y = r() * 650, a = r() * Math.PI * 2; const pts = [[x, y]];
    for (let k = 0; k < 40 + r() * 50; k++) { a += (r() - 0.5) * 0.9; x += Math.cos(a) * (6 + r() * 12); y += Math.sin(a) * (6 + r() * 12); pts.push([x, y]); }
    for (const [col, off, lw] of [["rgba(255,255,240,0.09)", 1.5, 1.2], ["rgba(16,14,10,0.85)", 0, 1.6]]) {
      w.beginPath(); pts.forEach(([px, py], k) => (k ? w.lineTo(px + off, py + off) : w.moveTo(px + off, py + off))); w.strokeStyle = col; w.lineWidth = lw; w.stroke(); }
  }
  // chalk: obsessive formulas + tally marks
  const ch = mk(W, H), q = ch.getContext("2d");
  q.fillStyle = q.strokeStyle = "rgba(238,238,228,0.92)"; q.textBaseline = "alphabetic";
  const chalkLine = (txt, x, y, rot, size) => { q.save(); q.translate(x, y); q.rotate(rot); q.font = `600 ${size}px Chalk`; q.fillText(txt, 0, 0); q.restore(); };
  chalkLine("a² + b² = c²", 110, 190, -0.04, 64); chalkLine("a² + b² = c²", 135, 268, -0.015, 62);
  chalkLine("a² + b² = c²", 95, 350, -0.07, 66); chalkLine("a² + b²  =  c²", 150, 432, 0.04, 70);
  chalkLine("F = ma", 430, 520, -0.1, 58); chalkLine("ПОВТОРИТЬ 1000 РАЗ", 80, 600, -0.03, 50);
  q.lineCap = "round"; q.lineWidth = 5;
  const tally = (x0, y0) => { for (let k = 0; k < 4; k++) { q.beginPath(); q.moveTo(x0 + k * 12 + r() * 3, y0 + r() * 5); q.lineTo(x0 + k * 12 + r() * 4 - 2, y0 + 64 + r() * 6); q.stroke(); }
    q.beginPath(); q.moveTo(x0 - 8, y0 + 50); q.lineTo(x0 + 48, y0 + 10); q.stroke(); };
  for (let g2 = 0; g2 < 7; g2++) tally(1390 + g2 * 62, 790 + r() * 8);
  for (let g2 = 0; g2 < 4; g2++) tally(1390 + g2 * 62, 890 + r() * 8);
  q.globalCompositeOperation = "destination-out"; q.drawImage(noiseCv(960, 540, 5, 0, 255, true), 0, 0, W, H);
  q.globalAlpha = 0.5; q.drawImage(noiseCv(480, 270, 6, 0, 200, true), 0, 0, W, H); q.globalAlpha = 1;
  w.globalAlpha = 0.88; w.drawImage(ch, 0, 0); w.globalAlpha = 1;
  // blood writing
  const bl = mk(W, H), b = bl.getContext("2d");
  b.save(); b.translate(1565, 300); b.rotate(-0.05); b.textAlign = "center"; b.textBaseline = "middle"; b.font = "102px Wet";
  b.fillStyle = "#300203"; b.fillText("УРОК НЕ", 4, -56); b.fillText("ОКОНЧЕН", 4, 78);
  b.fillStyle = BLOOD; b.fillText("УРОК НЕ", 0, -60); b.fillText("ОКОНЧЕН", 0, 74);
  b.restore();
  b.lineCap = "round"; b.strokeStyle = b.fillStyle = "#5e0508";
  for (let i = 0; i < 9; i++) { const x = 1350 + r() * 470, y0 = 345 + r() * 50, len = 30 + r() * 170, lw = 3 + r() * 5;
    b.lineWidth = lw; b.beginPath(); b.moveTo(x, y0); b.lineTo(x, y0 + len); b.stroke(); b.beginPath(); b.arc(x, y0 + len, lw * 0.8, 0, Math.PI * 2); b.fill(); }
  b.globalCompositeOperation = "source-atop"; b.globalAlpha = 0.4; b.drawImage(noiseCv(240, 135, 7, 0, 90), 0, 0, W, H); b.globalAlpha = 1;
  w.drawImage(bl, 0, 0);
  // baseboard
  w.fillStyle = "#12120e"; w.fillRect(0, 1016, W, 64); w.fillStyle = "rgba(255,255,240,0.07)"; w.fillRect(0, 1016, W, 3);

  // ---- graded logo (sickly, desaturated, bloody lows) + red silhouette glow
  logoH = mk(1024, 1024); const lg = logoH.getContext("2d");
  lg.filter = "saturate(0.5) contrast(1.22) brightness(0.86)"; lg.drawImage(logo, 0, 0, 1024, 1024); lg.filter = "none";
  lg.globalCompositeOperation = "source-atop";
  gr = lg.createLinearGradient(0, 0, 0, 1024); gr.addColorStop(0, "rgba(90,0,0,0)"); gr.addColorStop(0.55, "rgba(100,0,0,0.12)"); gr.addColorStop(1, "rgba(120,0,0,0.38)");
  lg.fillStyle = gr; lg.fillRect(0, 0, 1024, 1024);
  const P = 160; logoGlow = mk(LS + 2 * P, LS + 2 * P); const gg = logoGlow.getContext("2d");
  gg.filter = "blur(34px)"; gg.drawImage(logo, P, P, LS, LS); gg.filter = "none";
  gg.globalCompositeOperation = "source-in"; gg.fillStyle = "#ff1414"; gg.fillRect(0, 0, logoGlow.width, logoGlow.height);

  // ---- fog, grain, vignette
  const fog = (seed) => { const c = mk(2400, 1080), f = c.getContext("2d"); f.filter = "blur(70px)"; f.drawImage(noiseCv(20, 9, seed, 0, 255), -150, -150, 2700, 1380);
    f.filter = "blur(20px)"; f.globalCompositeOperation = "multiply"; f.drawImage(noiseCv(80, 36, seed + 1, 60, 255), 0, 0, 2400, 1080); return c; };
  fogA = fog(11); fogB = fog(21);
  for (let i = 0; i < 4; i++) GRAIN.push(noiseCv(1024, 576, 40 + i, 40, 216));
  vign = mk(W, H); const v = vign.getContext("2d"); gr = v.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 1.0);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.88)"); v.fillStyle = gr; v.fillRect(0, 0, W, H);
}

// ---------------- light model ----------------
const FLASH_STOPS = [[0, 1], [0.3, 0.97], [0.48, 0.72], [0.58, 0.82], [0.7, 0.46], [0.85, 0.13], [1, 0]];
const POOL_STOPS = [[0, 1], [0.45, 0.86], [0.75, 0.4], [1, 0]];
function applyLight(g, lights, amb) {
  dq.globalCompositeOperation = "source-over"; dq.clearRect(0, 0, W, H);
  dq.fillStyle = `rgba(0,0,0,${1 - amb})`; dq.fillRect(0, 0, W, H);
  dq.globalCompositeOperation = "destination-out";
  for (const L of lights) {
    if (L.i <= 0.001) continue;
    dq.save(); dq.translate(L.x, L.y); dq.scale(L.sx || 1, 1);
    const gr = dq.createRadialGradient(0, 0, 0, 0, 0, L.r); for (const [o, a] of L.stops) gr.addColorStop(o, `rgba(0,0,0,${a * L.i})`);
    dq.fillStyle = gr; dq.fillRect(-L.r, -L.r, 2 * L.r, 2 * L.r); dq.restore();
  }
  g.drawImage(dk, 0, 0);
}
const PATH = [[0.45, 960, 880, 250], [1.35, 330, 320, 320], [2.3, 400, 470, 330], [2.72, 1590, 310, 330], [3.7, 1530, 360, 330], [4.5, 990, 470, 290], [5.2, 960, 470, 290]];
function beam(t) {
  if (t < T.click || t >= T.dark) return { x: 960, y: 470, r: 290, i: 0 };
  let k = 0; while (k < PATH.length - 2 && t > PATH[k + 1][0]) k++;
  const a = PATH[k], b = PATH[k + 1], u = smooth(seg(t, a[0], b[0]));
  const x = lerp(a[1], b[1], u) + Math.sin(t * 7.3) * 6 + Math.sin(t * 12.7 + 1) * 3, y = lerp(a[2], b[2], u) + Math.cos(t * 6.1) * 5 + Math.sin(t * 13.3) * 2;
  let i = 0.95 + 0.05 * hash(Math.floor(t * 30));
  if (t < T.click + 0.16) i *= hash(Math.floor(t * 50) + 1) > 0.45 ? 1 : 0.08;
  if (t > T.flick0) { const p = seg(t, T.flick0, T.dark); i *= hash(Math.floor(t * 22) * 3.7 + 5) < p * 0.9 ? 0.06 : 1 - 0.3 * p; }
  return { x, y, r: lerp(a[3], b[3], u), i };
}
function pool(t) { const u = t - T.drop; return { x: 960 + 240 * Math.sin(u * 2.2 + 0.3) * Math.exp(-u * 0.12), y: 330, r: 900 }; }
function lightning(t) { if (t < T.drop) return 0; const u = t - T.drop; return clamp(Math.exp(-u * 10) + (u > 0.14 ? 0.75 * Math.exp(-(u - 0.14) * 13) : 0)); }
function bulbI(t, out) {
  let i = 0.92 + 0.08 * hash(Math.floor(t * 20) * 1.3);
  if (t >= T.loopA) { const ph = (t - T.loopA) % T.loopLen; for (const d of DIPS) if (ph >= d && ph < d + 0.35) i = hash(Math.floor(t * 28) * 2.1 + d) > 0.5 ? 0.1 : 0.85; }
  if (out >= 0) { if (out >= 0.45) return 0; i *= hash(Math.floor(out * 26) * 4.3 + 9) > out / 0.45 * 0.8 ? 1 : 0.04; }
  return i;
}
const heartPulse = (t) => { let p = 0; for (const h of HB) { if (t >= h) p = Math.max(p, Math.exp(-(t - h) * 7), t >= h + 0.19 ? 0.6 * Math.exp(-(t - h - 0.19) * 8) : 0); } return p; };

// ---------------- scene pieces ----------------
function logoXf(t) { const u = t - T.drop; return t < T.drop ? { s: 1, oy: 0 } : { s: 1 + 0.2 * Math.exp(-u * 9), oy: Math.sin(u * 1.4) * 4 }; }
function drawFog(g, t, a) {
  g.save(); g.globalCompositeOperation = "screen";
  g.globalAlpha = a; g.drawImage(fogA, -240 + Math.sin(t * 0.07) * 220 - t * 6, 0);
  g.globalAlpha = a * 0.8; g.drawImage(fogB, -240 - Math.sin(t * 0.05 + 1) * 220 + t * 4, 40 + Math.sin(t * 0.3) * 20);
  g.restore();
}
const DRIPS = (() => { const r = rng(55); return Array.from({ length: 24 }, () => ({ x: r() * W, w: 5 + r() * 13, len: 60 + r() * 360, d: r() * 0.9, sp: 4 + r() * 14 })); })();
function drawDrips(g, t) {
  const u = t - T.drop; if (u < 0.1) return;
  g.save();
  g.fillStyle = "#4a0306"; g.beginPath(); g.moveTo(0, 0);
  for (let x = 0; x <= W; x += 40) g.lineTo(x, 8 + 6 * Math.sin(x * 0.05) + 5 * hash(x) * eOut(seg(u, 0.1, 0.6)));
  g.lineTo(W, 0); g.fill();
  for (const d of DRIPS) {
    const L = d.len * eOut(seg(u, 0.15 + d.d, 2.9 + d.d)) + d.sp * Math.max(0, u - 3); if (L < 2) continue;
    const gr = g.createLinearGradient(0, 0, 0, L); gr.addColorStop(0, "#3a0204"); gr.addColorStop(1, "#8a0a0f");
    g.fillStyle = gr; g.fillRect(d.x - d.w / 2, 0, d.w, L);
    g.beginPath(); g.arc(d.x, L, d.w * 0.62, 0, Math.PI * 2); g.fillStyle = "#8a0a0f"; g.fill();
    g.fillStyle = "rgba(255,90,90,0.25)"; g.fillRect(d.x - d.w * 0.3, 0, Math.max(1.5, d.w * 0.15), L);
  }
  g.restore();
}
const DUST = (() => { const r = rng(77); return Array.from({ length: 120 }, () => ({ x: r() * W, y: r() * H, s: 1 + r() * 2.4, sp: 6 + r() * 22, ph: r() * 6.28 })); })();
function drawDust(g, t, L, I) {
  if (I <= 0.02) return;
  g.save(); g.globalCompositeOperation = "lighter";
  for (const p of DUST) {
    const x = p.x + Math.sin(t * 0.4 + p.ph) * 30, y = ((p.y - t * p.sp) % H + H) % H;
    const d = Math.hypot((x - L.x) / (L.sx || 1), y - L.y) / L.r; if (d >= 1) continue;
    g.globalAlpha = (1 - d) * (1 - d) * I * 0.55; g.fillStyle = "#fff2dc"; g.fillRect(x, y, p.s, p.s);
  }
  g.restore();
}
function drawEyes(g, t, a, lid, xf) {
  if (a <= 0.01 || lid <= 0.01) return;
  g.save(); g.globalCompositeOperation = "lighter";
  for (const [u, v] of EYE_UV) {
    const x = LX + (u - 0.5) * LS * xf.s, y = LY + (v - 0.5) * LS * xf.s + xf.oy;
    g.save(); g.translate(x, y); g.scale(xf.s, lid * xf.s);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 80);
    gr.addColorStop(0, `rgba(255,50,30,${0.6 * a})`); gr.addColorStop(0.3, `rgba(210,0,0,${0.28 * a})`); gr.addColorStop(1, "rgba(120,0,0,0)");
    g.fillStyle = gr; g.fillRect(-80, -80, 160, 160);
    g.fillStyle = `rgba(255,40,24,${a})`; g.beginPath(); g.ellipse(0, 0, 15, 7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = `rgba(255,210,180,${a})`; g.beginPath(); g.ellipse(0, 0, 7, 3.6, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  g.restore();
}
function drawPresents(g, t, out, I) {
  if (t < T.presents) return;

    for (let b = 0.2; b < T.loopLen; b += 1.2) if (A0 + b < stopAt) heart(A0 + b, 0.45);
    DIPS.forEach((d) => { const at = A0 + d; if (at >= stopAt) return; for (let i = 0; i < 6; i++) noise(at + hash(i + d * 10 + k) * 0.35, 0.03, 0.13, { type: "highpass", f0: 2200 });
      voice("sawtooth", 100, at, 0.35, 0.03, { cut: 900, rel: 0.02 }); });
  }
  voice("sine", 49, D + 0.6, 4.0, 0.14, { atk: 1.0, rel: 1.0 });
  // "ПРЕДСТАВЛЯЕТ" — neon letters crackling on
  PRES_ON.forEach((on, i) => { noise(on, 0.03, 0.12, { type: "bandpass", f0: 3500, q: 3 }); if (i % 2) noise(on + 0.09, 0.025, 0.08, { type: "bandpass", f0: 4200, q: 3 }); });
  voice("sine", 55, T.presents + 0.75, 1.2, 0.35, { f1: 38, rel: 0.5, rev: 0.4 });
  if (outroAt != null) finale(outroAt);
  return master;
}

async function renderAudioWav(seconds, outroAt) {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  scheduleAudio(oc, oc.destination, 0, { outroAt, loops: 2, endAt: seconds });
  const buf = await oc.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab), ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); dv.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); dv.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  let bin = ""; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}

// ---------------- live playback ----------------
let start = null, outroAt = null, ac = null, bus = null, done = false;
function gate(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const fl = hash(Math.floor(t * 12)) > 0.08 ? 1 : 0.3;
  ctx.font = "40px Mono"; ctx.fillStyle = `rgba(232,224,204,${0.85 * fl})`; ctx.fillText("НАЖМИ, ЧТОБЫ ВОЙТИ", W / 2, H / 2);
  ctx.font = "24px Mono"; ctx.fillStyle = "rgba(200,40,40,0.7)"; ctx.fillText("ЛУЧШЕ В НАУШНИКАХ. И НЕ ОДНОМУ.", W / 2, H / 2 + 64);
}
function begin(sound) {
  start = performance.now() / 1000;
  if (sound) { ac = new (window.AudioContext || window.webkitAudioContext)(); bus = scheduleAudio(ac, ac.destination, ac.currentTime + 0.03, { loops: 12 }); }
}
function onInput() {
  if (start === null) { begin(true); return; }
  const t = performance.now() / 1000 - start;
  if (outroAt === null && t > T.drop + 0.8) {
    outroAt = t;
    if (ac) { bus.gain.setTargetAtTime(0, ac.currentTime + 0.3, 0.08); scheduleAudio(ac, ac.destination, ac.currentTime + 0.02, { finaleOnly: true }); }
  }
}
function loop() {
  const now = performance.now() / 1000;
  if (start === null) gate(now);
  else if (render(now - start, outroAt) && !done) { done = true; window.dispatchEvent(new Event("yarmak:intro-end")); try { parent.postMessage({ type: "yarmak:intro-end" }, "*"); } catch (e) {} }
  requestAnimationFrame(loop);
}
Promise.all([new Promise((r) => (logo.complete ? r() : (logo.onload = r))),
  document.fonts.load("124px Wet", "УРОК НЕ ОКОНЧЕН"), document.fonts.load("78px Distress", PRES),
  document.fonts.load("36px Mono", "REC КАБИНЕТ №13 0123456789:"), document.fonts.load("600 60px Chalk", "a² + b² = c² ПОВТОРИТЬ")]).then(() => {
  prepare();
  if (CAPTURE) { window.renderFrame = (t) => render(t, T.videoOutro); window.renderAudioWav = renderAudioWav; window.READY = true; return; }
  if (params.has("autoplay")) begin(false);
  addEventListener("keydown", onInput); addEventListener("pointerdown", onInput);
  loop();
});
