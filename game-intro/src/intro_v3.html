<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YARMAK TEAM — заставка «Вайбкодинг»</title>
<style>
@font-face { font-family: "PS2P"; src: url(data:font/woff2;base64,__PS2P_LATIN__) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2200-25FF; }
@font-face { font-family: "PS2P"; src: url(data:font/woff2;base64,__PS2P_CYR__) format("woff2"); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Pixelify"; font-weight: 700; src: url(data:font/woff2;base64,__PIX_LATIN__) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2200-22FF; }
@font-face { font-family: "Pixelify"; font-weight: 700; src: url(data:font/woff2;base64,__PIX_CYR__) format("woff2"); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; cursor: pointer; }
canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
/* ============================================================
   YARMAK TEAM — заставка №3 «Вайбкодинг» (Canvas 2D + WebAudio).
   ~12 с: редактор кода → Run → цифровой дождь → ASCII-логотип →
   «компиляция» в картинку → print("ПРЕДСТАВЛЯЕТ") → пиксельный распад.
   Музыка — синтвейв 120 BPM.  ?autoplay=1 — без звука; ?capture=1 — запись.
   По окончании: событие "yarmak:intro-end" + postMessage родителю.
   ============================================================ */
const W = 1920, H = 1080;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const params = new URLSearchParams(location.search), CAPTURE = params.has("capture");
const BPM = 120, BEAT = 0.5, BAR = 2.0;
const T = { type: 0.45, cps: 62, run: 3.35, build0: 3.55, build1: 4.15, glitch: 4.35, rain: 4.45, ascii: 4.7, lock: 5.75, drop: 6.0,
  print: 7.0, presents: 7.95, prompt: 8.6, glint0: 7.3, glintEvery: 3.3, videoOutro: 10.6, outroLen: 1.35, videoLen: 12.0 };
const GREEN = "#39ff6a", LIME = "#a6ff3b", GOLD = "#ffd23f", CYAN = "#5ef2ff", PINK = "#ff6bd6", GRAY = "#6f8f78";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (k) => 1 - Math.pow(1 - k, 3), eIn = (k) => k * k * k;
const eBack = (k) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let r = Math.imul(s ^ (s >>> 15), 1 | s); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const snap = (v, g = 2) => Math.round(v / g) * g;
const kickEnv = (t) => { if (t < T.drop) return 0; const b = (t - T.drop) / BEAT, ph = b - Math.floor(b); return Math.exp(-ph * BEAT * 8); };

const logo = new Image(); logo.src = "data:image/webp;base64,__LOGO__";
const LS = 760, LX = W / 2, LY = 455;
const scene = document.createElement("canvas"); scene.width = W; scene.height = H; const sc = scene.getContext("2d");
let scan, vign, ASCII = [];
const RAMP = " .:-=+*#%@";
const RCH = "0123456789ABCDEF{}[]()<>=+-*/#$%&;:!?";
function prepare() {
  scan = document.createElement("canvas"); scan.width = W; scan.height = H;
  const q = scan.getContext("2d"); q.fillStyle = "rgba(0,0,0,0.2)"; for (let y = 0; y < H; y += 4) q.fillRect(0, y + 2, W, 2);
  vign = document.createElement("canvas"); vign.width = W; vign.height = H;
  const v = vign.getContext("2d"), g = v.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.8)"); v.fillStyle = g; v.fillRect(0, 0, W, H);
  // logo -> ASCII cells
  const N = 44, cs = LS / N, s = document.createElement("canvas"); s.width = N; s.height = N;
  const q2 = s.getContext("2d"); q2.drawImage(logo, 0, 0, N, N);
  const d = q2.getImageData(0, 0, N, N).data;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4; if (d[i + 3] < 100) continue;
    const lum = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
    const mx = Math.max(d[i], d[i + 1], d[i + 2], 1), boost = (150 + lum * 105) / mx;
    const cr = Math.min(255, d[i] * boost), cg = Math.min(255, d[i + 1] * boost + 30), cb = Math.min(255, d[i + 2] * boost);
    ASCII.push({ x: LX - LS / 2 + x * cs + cs / 2, y: LY - LS / 2 + y * cs + cs / 2, col: `rgb(${cr | 0},${cg | 0},${cb | 0})`,
      ch: RAMP[Math.min(RAMP.length - 1, 2 + Math.floor(lum * (RAMP.length - 2)))], t0: T.ascii + (y / N) * 0.5 + hash(x * 3.1) * 0.2, id: y * N + x });
  }
}

// ---------------- scene 1: the code editor ----------------
const CODE = [
  "# game_jam.py",
  "from yarmak import Team",
  "import claude",
  "",
  "team = Team(\"YARMAK\")",
  "team.vibe = \"MAX\"",
  "",
  "def game_jam():",
  "    return claude.build(team)",
  "",
  "game_jam()",
];
const KW = /\b(from|import|def|return)\b/g;
function colorize(line) { // -> [{text,color}]
  if (line.startsWith("#")) return [{ text: line, color: GRAY }];
  const out = []; let i = 0;
  const re = /("[^"]*")|\b(from|import|def|return)\b|\b(Team|claude|build|game_jam)\b|(\d+)/g; let m;
  while ((m = re.exec(line))) {
    if (m.index > i) out.push({ text: line.slice(i, m.index), color: "#e8ffe9" });
    out.push({ text: m[0], color: m[1] ? GOLD : m[2] ? PINK : m[3] ? CYAN : LIME }); i = m.index + m[0].length;
  }
  if (i < line.length) out.push({ text: line.slice(i), color: "#e8ffe9" });
  return out;
}
const CODE_START = (() => { const r = []; let n = 0; for (const l of CODE) { r.push(n); n += l.length + 2; } return r; })();
const CODE_LEN = CODE_START[CODE_START.length - 1] + CODE[CODE.length - 1].length;
const typedChars = (t) => Math.max(0, Math.floor((t - T.type) * T.cps));

function drawEditor(g, t) {
  if (t > T.rain + 0.3) return;
  const zoom = 1 + eIn(seg(t, T.glitch, T.rain + 0.3)) * 0.6, fade = 1 - seg(t, T.rain, T.rain + 0.3);
  g.save(); g.globalAlpha = fade; g.translate(W / 2, H / 2); g.scale(zoom, zoom); g.translate(-W / 2, -H / 2);
  const x0 = 250, y0 = 110, w = 1420, h = 800;
  g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(x0 + 16, y0 + 20, w, h);
  g.fillStyle = "#0b1a12"; g.fillRect(x0, y0, w, h);
  g.fillStyle = "#133322"; g.fillRect(x0, y0, w, 56);
  [["#ff5f57", 0], [GOLD, 1], [GREEN, 2]].forEach(([c, i]) => { g.fillStyle = c; g.fillRect(x0 + 24 + i * 34, y0 + 20, 18, 18); });
  g.font = "18px PS2P"; g.textBaseline = "middle"; g.fillStyle = "#cfe"; g.fillText("game_jam.py — YARMAK IDE", x0 + 150, y0 + 29);
  // run button
  const runOn = t >= T.run && t < T.run + 0.25;
  g.fillStyle = runOn ? LIME : "#1f5a35"; g.fillRect(x0 + w - 190, y0 + 12, 160, 34);
  g.fillStyle = runOn ? "#062" : "#bfffcf"; g.fillText("▶ RUN", x0 + w - 160, y0 + 30);
  // gutter + code
  g.fillStyle = "#08130d"; g.fillRect(x0, y0 + 56, 84, h - 56 - 230);
  const n = typedChars(t);
  g.font = "24px PS2P"; g.textBaseline = "top";
  CODE.forEach((line, li) => {
    const y = y0 + 84 + li * 42;
    g.fillStyle = "#3c6b4c"; g.fillText(String(li + 1).padStart(2, " "), x0 + 18, y);
    const vis = clamp(n - CODE_START[li], 0, line.length); if (vis <= 0 && n < CODE_START[li]) return;
    let x = x0 + 110, left = vis;
    for (const tok of colorize(line)) {
      if (left <= 0) break; const s = tok.text.slice(0, left); left -= tok.text.length;
      g.fillStyle = tok.color; g.fillText(s, x, y); x += g.measureText(s).width;
    }
    if (n >= CODE_START[li] && n <= CODE_START[li] + line.length + 1 && (n < CODE_LEN || Math.floor(t * 3) % 2 === 0) && t < T.run)
      { g.fillStyle = LIME; g.fillRect(x + 2, y - 2, 14, 28); }
  });
  // terminal pane
  const ty = y0 + h - 230;
  g.fillStyle = "#050d08"; g.fillRect(x0, ty, w, 230);
  g.fillStyle = "#133322"; g.fillRect(x0, ty, w, 4);
  g.font = "20px PS2P"; g.fillStyle = GRAY; g.fillText("TERMINAL", x0 + 24, ty + 22);
  if (t >= T.run) {
    g.fillStyle = "#e8ffe9"; g.fillText("$ python game_jam.py", x0 + 24, ty + 64);
    const p = seg(t, T.build0, T.build1), blocks = Math.floor(p * 30);
    if (t >= T.build0) {
      g.fillStyle = GREEN; g.fillText("Сборка игры  [" + "█".repeat(blocks) + "·".repeat(30 - blocks) + "] " + Math.round(p * 100) + "%", x0 + 24, ty + 104);
    }
    if (t >= T.build1 + 0.05) { g.fillStyle = LIME; g.fillText("✓ Готово за 0.42 с — запуск…", x0 + 24, ty + 144); }
  }
  g.restore();
}

// ---------------- scene 2: digital rain ----------------
const COLS = 72, CW = W / COLS, CH = 30;
const RAIN = Array.from({ length: COLS }, (_, i) => ({ sp: 420 + hash(i) * 520, off: hash(i + 7) * 1400, len: 10 + Math.floor(hash(i + 3) * 16) }));
function drawRain(g, t, strength) {
  if (strength <= 0) return;
  g.font = "22px PS2P"; g.textBaseline = "middle"; g.textAlign = "center";
  const tt = t - T.rain;
  for (let c = 0; c < COLS; c++) {
    const r = RAIN[c], head = (tt * r.sp + r.off) % (H + r.len * CH + 200) - 100;
    const x = c * CW + CW / 2;
    for (let k = 0; k < r.len; k++) {
      const y = head - k * CH; if (y < -30 || y > H + 30) continue;
      const ch = RCH[Math.floor(hash(c * 131 + Math.floor(y / CH) * 17 + Math.floor(t * 12 + k)) * RCH.length)];
      const a = (1 - k / r.len) * strength;
      g.fillStyle = k === 0 ? `rgba(230,255,235,${a})` : `rgba(57,255,106,${a * 0.75})`;
      g.fillText(ch, snap(x), snap(Math.floor(y / CH) * CH));
    }
  }
  g.textAlign = "left";
}

// ---------------- logo: ASCII -> image ----------------
function drawAscii(g, t) {
  if (t < T.ascii || t > T.drop + 0.35) return;
  const fade = 1 - seg(t, T.drop, T.drop + 0.35);
  const bk = seg(t, T.ascii, T.ascii + 0.3) * fade, bd = g.createRadialGradient(LX, LY, 0, LX, LY, LS * 0.62);
  bd.addColorStop(0, `rgba(1,6,3,${0.92 * bk})`); bd.addColorStop(0.8, `rgba(1,6,3,${0.8 * bk})`); bd.addColorStop(1, "rgba(1,6,3,0)");
  g.fillStyle = bd; g.fillRect(LX - LS, LY - LS, LS * 2, LS * 2);
  g.font = "17px PS2P"; g.textBaseline = "middle"; g.textAlign = "center";
  for (const c of ASCII) {
    if (t < c.t0) continue;
    const locked = t >= T.lock;
    const ch = locked ? c.ch : RCH[Math.floor(hash(c.id + Math.floor(t * 14)) * RCH.length)];
    const k = seg(t, c.t0, c.t0 + 0.12);
    g.globalAlpha = k * fade; g.fillStyle = t < c.t0 + 0.12 ? "#e8ffe9" : c.col;
    g.fillText(ch === " " ? "." : ch, c.x, c.y);
  }
  g.globalAlpha = 1; g.textAlign = "left";
}
function drawLogo(g, t, bob) {
  if (t < T.lock) return;
  const k = seg(t, T.lock, T.drop + 0.1);
  const s = LS * (lerp(1.0, 1.04, 1 - eBack(seg(t, T.drop, T.drop + 0.45))) + 0.02 * kickEnv(t));
  const x = LX - s / 2, y = LY - s / 2 + bob;
  // "compile" reveal: horizontal scan from top with a bright line
  const scanY = LY - LS / 2 + lerp(0, LS, eOut(k));
  g.save();
  if (t >= T.drop) { g.filter = "blur(16px)"; g.globalAlpha = 0.6; g.drawImage(logo, x + 8, y + 24, s, s); g.filter = "none"; g.globalAlpha = 1; }
  g.beginPath(); g.rect(0, 0, W, k >= 1 ? H : scanY + bob); g.clip();
  g.drawImage(logo, x, y, s, s);
  g.restore();
  if (k < 1) { g.fillStyle = "rgba(230,255,235,0.9)"; g.fillRect(x - 20, scanY + bob - 3, s + 40, 6); g.fillStyle = "rgba(57,255,106,0.35)"; g.fillRect(x - 20, scanY + bob - 14, s + 40, 28); }
  // glint
  if (t > T.glint0) {
    const gk = ((t - T.glint0) % T.glintEvery) / 0.7;
    if (gk <= 1) {
      g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.5 * Math.sin(gk * Math.PI);
      const gx = lerp(x - 200, x + s + 200, gk), gr = g.createLinearGradient(gx - 90, 0, gx + 90, 0);
      gr.addColorStop(0, "rgba(57,255,106,0)"); gr.addColorStop(0.5, "rgba(160,255,190,0.35)"); gr.addColorStop(1, "rgba(57,255,106,0)");
      g.beginPath(); g.arc(LX, LY + bob, s * 0.46, 0, Math.PI * 2); g.clip(); g.fillStyle = gr; g.fillRect(x, y, s, s); g.restore();
    }
  }
}
function drawAura(g, t, bob) {
  const k = seg(t, T.drop - 0.2, T.drop + 0.3); if (k <= 0) return;
  const gr = g.createRadialGradient(LX, LY + bob, 60, LX, LY + bob, 640);
  gr.addColorStop(0, `rgba(57,255,106,${(0.3 + 0.2 * kickEnv(t)) * k})`); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // orbiting code brackets
  g.font = "34px PS2P"; g.textAlign = "center"; g.textBaseline = "middle";
  const sym = ["{ }", "</>", "( )", "[ ]", "=>", "#", "::", "++"];
  sym.forEach((s0, i) => {
    const a = t * 0.35 + (i / sym.length) * Math.PI * 2, R = 470;
    g.globalAlpha = k * (0.35 + 0.35 * Math.sin(a * 2) ** 2);
    g.fillStyle = i % 2 ? LIME : CYAN; g.fillText(s0, snap(LX + Math.cos(a) * R), snap(LY + bob + Math.sin(a) * R * 0.9));
  });
  g.globalAlpha = 1; g.textAlign = "left";
}
const BURST = (() => { const r = rng(12); return Array.from({ length: 170 }, () => ({ a: r() * 6.283, sp: 300 + r() * 900, r0: 300 + r() * 80, life: 0.6 + r() * 0.8, ch: RCH[Math.floor(r() * RCH.length)], c: [GREEN, "#fff", LIME, CYAN][Math.floor(r() * 4)] })); })();
function drawBurst(g, t) {
  const dt = t - T.drop; if (dt < 0 || dt > 1.5) return;
  g.font = "20px PS2P"; g.textAlign = "center"; g.textBaseline = "middle";
  for (const p of BURST) { if (dt > p.life) continue; const k = dt / p.life, r = p.r0 + p.sp * dt * (1 - 0.4 * k);
    g.globalAlpha = 1 - k; g.fillStyle = p.c; g.fillText(p.ch, snap(LX + Math.cos(p.a) * r), snap(LY + Math.sin(p.a) * r + 420 * dt * dt)); }
  g.globalAlpha = 1; g.textAlign = "left";
}

// ---------------- text ----------------
function drawPrint(g, t) {
  if (t < T.print) return;
  const cmd = '>>> print("ПРЕДСТАВЛЯЕТ")', n = clamp(Math.floor((t - T.print) * 34), 0, cmd.length);
  g.save(); g.font = "22px PS2P"; g.textBaseline = "middle";
  const w = g.measureText(cmd).width, x0 = W / 2 - w / 2, y = 890;
  g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(x0 - 20, y - 22, w + 40, 44);
  colorize(cmd.slice(4)).length; // (keep colour logic shared)
  g.fillStyle = GRAY; g.fillText(cmd.slice(0, Math.min(n, 4)), x0, y);
  if (n > 4) { let x = x0 + g.measureText(">>> ").width; for (const tok of colorize(cmd.slice(4, n))) { g.fillStyle = tok.text === "print" ? CYAN : tok.color; g.fillText(tok.text, x, y); x += g.measureText(tok.text).width; } }
  g.restore();
}
function drawPresents(g, t) {
  if (t < T.presents) return;
  const k = seg(t, T.presents, T.presents + 0.3), jit = (1 - k) * 18;
  g.save(); g.font = "700 64px Pixelify"; g.textAlign = "center"; g.textBaseline = "middle"; g.letterSpacing = "16px";
  const y = 972;
  if (k < 1) { g.globalAlpha = 0.7; g.fillStyle = PINK; g.fillText("ПРЕДСТАВЛЯЕТ", W / 2 - jit, y); g.fillStyle = CYAN; g.fillText("ПРЕДСТАВЛЯЕТ", W / 2 + jit, y); }
  g.globalAlpha = k; g.fillStyle = "#000"; g.fillText("ПРЕДСТАВЛЯЕТ", W / 2 + 5, y + 6);
  g.fillStyle = "#156b33"; g.fillText("ПРЕДСТАВЛЯЕТ", W / 2 + 3, y + 3);
  g.fillStyle = "#f4fff6"; g.fillText("ПРЕДСТАВЛЯЕТ", W / 2, y);
  g.restore();
}
function drawPrompt(g, t) {
  if (CAPTURE || t < T.prompt || Math.floor((t - T.prompt) / BEAT) % 2) return;
  g.save(); g.font = "18px PS2P"; g.textAlign = "center"; g.fillStyle = LIME; g.fillText("[ ENTER ] — НАЧАТЬ ИГРУ", W / 2, 1045); g.restore();
}

function renderScene(g, t) {
  const bob = t > T.drop ? Math.sin((t - T.drop) * Math.PI / BAR) * 7 : 0;
  const sh = t >= T.drop ? Math.exp(-(t - T.drop) * 7) * 18 : 0;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#020906"); bg.addColorStop(1, "#010402");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.save(); g.translate(snap(Math.sin(t * 89) * sh), snap(Math.cos(t * 67) * sh));
  const rainK = seg(t, T.rain - 0.1, T.rain + 0.2) * lerp(1, 0.5, seg(t, T.ascii, T.ascii + 0.4)) * lerp(1, 0.56, seg(t, T.lock, T.drop + 0.5));
  drawRain(g, t, rainK);
  drawAura(g, t, bob);
  drawAscii(g, t);
  drawLogo(g, t, bob);
  drawBurst(g, t);
  g.restore();
  drawEditor(g, t);
  drawPrint(g, t);
  drawPresents(g, t);
  drawPrompt(g, t);
  const f = t >= T.drop ? Math.exp(-(t - T.drop) * 6) : 0;
  if (f > 0.01) { g.fillStyle = `rgba(225,255,232,${0.55 * f})`; g.fillRect(0, 0, W, H); }
}

let _gl = 0;
function render(t, outroAt) {
  const out = outroAt == null ? -1 : t - outroAt;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (out > T.outroLen) return true;
  renderScene(sc, t);
  sc.drawImage(scan, 0, 0); sc.drawImage(vign, 0, 0);
  // glitch slices around the "run → rain" moment
  const gl = Math.exp(-Math.abs(t - T.glitch) * 14) + (out >= 0 ? 0.15 : 0);
  if (gl > 0.05) {
    const r = rng(Math.floor(t * 30)); let y = 0;
    while (y < H) { const h = 16 + Math.floor(r() * 80), dx = r() < 0.5 ? (r() - 0.5) * 160 * gl : 0; ctx.drawImage(scene, 0, y, W, h, dx, y, W, h);
      if (dx && r() < 0.4) { ctx.fillStyle = r() < 0.5 ? "rgba(255,107,214,0.18)" : "rgba(94,242,255,0.18)"; ctx.fillRect(0, y, W, h); } y += h; }
  } else ctx.drawImage(scene, 0, 0);
  if (out >= 0) {
    // pixel dissolve into black
    const B = 40, p = seg(out, 0.05, 0.95);
    for (let y = 0; y < H; y += B) for (let x = 0; x < W; x += B) {
      const hsh = hash(x * 0.37 + y * 1.91);
      if (hsh < p) { ctx.fillStyle = "#000"; ctx.fillRect(x, y, B, B); }
      else if (hsh < p + 0.04) { ctx.fillStyle = GREEN; ctx.fillRect(x, y, B, B); }
    }
    const tk = seg(out, 0.45, 0.6) * (1 - seg(out, 1.15, 1.35));
    if (tk > 0) { ctx.save(); ctx.globalAlpha = tk; ctx.font = "24px PS2P"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#000"; ctx.fillRect(W / 2 - 520, H / 2 - 36, 1040, 72);
      ctx.fillStyle = LIME; ctx.fillText("Process finished with exit code 0", W / 2, H / 2); ctx.restore(); }
  }
  return false;
}

// ---------------- music: synthwave 120 BPM ----------------
function scheduleAudio(ac, dest, t0, opts) {

  const wet = ac.createGain(); wet.gain.value = 0.35; echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(out);
  const N = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const nb = (() => { const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0), r = rng(8); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; return b; })();
  const voice = (type, f, at, dur, vol, o = {}) => {
    const T0 = t0 + at, g = ac.createGain(), fl = ac.createBiquadFilter();
    fl.type = "lowpass"; fl.frequency.setValueAtTime(o.cut || 18000, T0); if (o.cut1) fl.frequency.exponentialRampToValueAtTime(o.cut1, T0 + dur); fl.Q.value = o.q || 0.7;
    const oscs = (o.detune ? [-o.detune, o.detune] : [0]).map((dt) => { const s = ac.createOscillator(); s.type = type; s.frequency.setValueAtTime(f, T0); s.detune.value = dt;
      if (o.f1) s.frequency.exponentialRampToValueAtTime(o.f1, T0 + dur); s.connect(fl); s.start(T0); s.stop(T0 + dur + (o.rel || 0.05) + 0.05); return s; });
    const atk = o.atk || 0.005, rel = o.rel || 0.05;
    g.gain.setValueAtTime(0.0001, T0); g.gain.exponentialRampToValueAtTime(vol, T0 + atk); g.gain.setValueAtTime(vol, T0 + Math.max(atk, dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, T0 + dur + rel);
    fl.connect(g); g.connect(out); if (o.echo) g.connect(echo);
    if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.value = 9; l.connect(lg); oscs.forEach((s) => lg.connect(s.detune)); l.start(T0 + 0.15); l.stop(T0 + dur + rel); }
  };
  const noise = (at, dur, vol, type, f0, f1, q) => {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), T0 = t0 + at;
    s.buffer = nb; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f0, T0); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, T0 + dur); if (q) fl.Q.value = q;
    g.gain.setValueAtTime(vol, T0); g.gain.exponentialRampToValueAtTime(0.0001, T0 + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(T0); s.stop(T0 + dur + 0.05);
  };
  const kick = (at) => voice("sine", 140, at, 0.2, 0.95, { f1: 40, rel: 0.12 });
  const snare = (at) => { noise(at, 0.32, 0.4, "bandpass", 1600, 0, 0.8); noise(at, 0.5, 0.12, "highpass", 5000); voice("triangle", 190, at, 0.08, 0.25, { f1: 120 }); };
  const hat = (at, v = 0.08) => noise(at, 0.04, v, "highpass", 8000);
  const finale = (fin) => {
    kick(fin); noise(fin, 1.6, 0.25, "highpass", 3000, 7000);
    [45, 57, 64, 69, 72].forEach((m, i) => voice("sawtooth", N(m), fin, 1.3, i ? 0.05 : 0.18, { cut: 3000, cut1: 300, detune: 9, rel: 0.4 }));
    [81, 76, 72, 69, 64, 57].forEach((m, i) => voice("square", N(m), fin + 0.05 + i * 0.08, 0.1, 0.05, { echo: true }));
  };
  if (finaleOnly) { finale(0); return master; }

  // typing clicks + ambient pad under the editor
  for (let i = 0; i < CODE_LEN; i++) { const at = T.type + i / T.cps; if (CODE.join("\n")[i] === " ") continue; noise(at, 0.018, 0.11 + 0.06 * hash(i), "bandpass", 2500 + hash(i + 1) * 2500, 0, 1.2); }
  [57, 60, 64].forEach((m) => voice("sawtooth", N(m), 0.3, T.run - 0.3, 0.03, { cut: 700, detune: 12, atk: 1.2, rel: 0.4 }));
  voice("sine", N(33), 0.3, T.run, 0.08, { atk: 1.0 });
  // run + build progress
  voice("square", N(84), T.run, 0.06, 0.1); voice("square", N(91), T.run + 0.07, 0.12, 0.1);
  for (let i = 0; i < 10; i++) voice("square", N(72 + i), T.build0 + i * (T.build1 - T.build0) / 10, 0.04, 0.05);
  voice("square", N(88), T.build1 + 0.05, 0.08, 0.08); voice("square", N(96), T.build1 + 0.13, 0.2, 0.08);
  // glitch + rain build (3 beats before the drop)
  noise(T.glitch, 0.25, 0.4, "bandpass", 5000, 300, 2); voice("sawtooth", 220, T.glitch, 0.25, 0.08, { f1: 40 });
  voice("sawtooth", N(33), T.rain, T.drop - T.rain, 0.22, { cut: 200, cut1: 2500, detune: 8 });
  for (let at = T.rain, i = 0; at < T.drop - 0.01; at += BEAT / 4, i++) {
    voice("sawtooth", N([57, 60, 64, 69][i % 4] + 12), at, BEAT / 4 * 0.8, 0.05, { cut: lerp(400, 6000, (at - T.rain) / (T.drop - T.rain)), q: 4 });
    hat(at, 0.03 + 0.06 * (at - T.rain) / (T.drop - T.rain));
  }
  for (let i = 0; i < 8; i++) snare(T.drop - BEAT + i * BEAT / 8);
  noise(T.rain, T.drop - T.rain, 0.12, "bandpass", 300, 9000, 3);

  // main groove: Am – F – G – Em
  const LEAD = [
    [[69, 0, .5], [72, .5, .5], [76, 1, 1], [74, 2, .5], [72, 2.5, .5], [71, 3, .5], [72, 3.5, .5]],
    [[69, 0, 1], [72, 1, .5], [77, 1.5, 1.5], [76, 3, 1]],
    [[74, 0, .5], [79, .5, .5], [83, 1, 1], [81, 2, .5], [79, 2.5, .5], [74, 3, 1]],
    [[76, 0, 1.5], [79, 1.5, .5], [83, 2, 1], [81, 3, .5], [79, 3.5, .5]],
  ];
  const ROOT = [45, 41, 43, 40], CHORD = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]];
  const bars = 4 * loops;
  for (let bar = 0; bar < bars; bar++) {
    const b0 = T.drop + bar * BAR, j = bar % 4;
    for (let h = 0; h < 8; h++) {
      const at = b0 + h * BEAT / 2;
      if (outroAt != null && at >= outroAt - 0.01) break;
      voice("sawtooth", N(ROOT[j] + (h % 2 ? 12 : 0)), at, BEAT / 2 * 0.8, 0.2, { cut: 900, cut1: 300, detune: 6 });
      if (h % 2 === 0) { const q = h / 2; if (q % 2 === 0) kick(at); else snare(at); }
      hat(at + BEAT / 4, 0.07); hat(at, 0.04);
    }
    if (outroAt != null && b0 >= outroAt - 0.01) break;
    const padDur = outroAt != null ? Math.min(BAR, outroAt - b0) : BAR;
    CHORD[j].forEach((m) => voice("sawtooth", N(m), b0, padDur * 0.97, 0.035, { cut: 1600, detune: 14, atk: 0.08, rel: 0.2 }));
    LEAD[j].forEach(([m, at, d]) => { if (outroAt != null && b0 + at * BEAT >= outroAt - 0.01) return;
      voice("square", N(m + 12), b0 + at * BEAT, d * BEAT * 0.9, 0.07, { cut: 5000, echo: true, vib: d >= 1 }); });
  }
  noise(T.drop, 1.4, 0.3, "highpass", 3000, 7000); voice("sine", 60, T.drop, 0.9, 0.6, { f1: 30 });
  for (let g0 = T.glint0; g0 < (outroAt ?? T.drop + bars * BAR); g0 += T.glintEvery) voice("sine", 2500, g0, 0.3, 0.03, { f1: 7000 });
  for (let i = 0; i < 24; i++) noise(T.print + i / 34, 0.015, 0.08, "bandpass", 3000, 0, 1.2);
  voice("square", N(81), T.presents, 0.12, 0.08, { echo: true }); voice("square", N(88), T.presents + 0.12, 0.3, 0.08, { echo: true });
  if (outroAt != null) finale(outroAt + 0.4);
  return master;
}

async function renderAudioWav(seconds, outroAt) {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  scheduleAudio(oc, oc.destination, 0, { outroAt, loops: 1 });
  const buf = await oc.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab), ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); dv.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); dv.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  let bin = ""; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}

// ---------------- live playback ----------------
let start = null, outroAt = null, ac = null, bus = null, done = false;
function gate(t) {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (Math.floor(t * 1.6) % 2 === 0) { ctx.font = "30px PS2P"; ctx.fillStyle = LIME; ctx.fillText("▶ НАЖМИТЕ, ЧТОБЫ НАЧАТЬ", W / 2, H / 2); }
  ctx.font = "16px PS2P"; ctx.fillStyle = "rgba(166,255,59,0.45)"; ctx.fillText("ЗВУК ВКЛЮЧИТСЯ ПОСЛЕ НАЖАТИЯ", W / 2, H / 2 + 60);
}
function begin(sound) {
  start = performance.now() / 1000;
  if (sound) { ac = new (window.AudioContext || window.webkitAudioContext)(); bus = scheduleAudio(ac, ac.destination, ac.currentTime + 0.03, { loops: 10 }); }
}
function onInput() {
  if (start === null) { begin(true); return; }
  const t = performance.now() / 1000 - start;
  if (outroAt === null && t > T.drop + 0.6) {
    outroAt = t;
    if (ac) { bus.gain.setTargetAtTime(0, ac.currentTime, 0.06); scheduleAudio(ac, ac.destination, ac.currentTime + 0.35, { finaleOnly: true }); }
  }
}
function loop() {
  const now = performance.now() / 1000;
  if (start === null) gate(now);
  else if (render(now - start, outroAt) && !done) { done = true; window.dispatchEvent(new Event("yarmak:intro-end")); try { parent.postMessage({ type: "yarmak:intro-end" }, "*"); } catch (e) {} }
  requestAnimationFrame(loop);
}
Promise.all([new Promise((r) => (logo.complete ? r() : (logo.onload = r))), document.fonts.load("24px PS2P", "game ЗВУК █·✓▶"), document.fonts.load("700 64px Pixelify", "ПРЕДСТАВЛЯЕТ")]).then(() => {
  prepare();
  if (CAPTURE) { window.renderFrame = (t) => render(t, T.videoOutro); window.renderAudioWav = renderAudioWav; window.READY = true; return; }
  if (params.has("autoplay")) begin(false);
  addEventListener("keydown", onInput); addEventListener("pointerdown", onInput);
  loop();
});
